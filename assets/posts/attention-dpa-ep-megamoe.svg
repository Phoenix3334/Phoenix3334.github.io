<text x="38" y="76" class="title" >同一组 GPU，两种不同的层内并行方式</text>
<text x="38" y="103" class="sub" >MLA 让 Attention DP-A 更有价值；进入 MoE 时，Token 按 Expert 路由跨 Rank 流动。</text>
