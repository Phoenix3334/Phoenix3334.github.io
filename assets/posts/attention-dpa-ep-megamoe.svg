<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="575" viewBox="0 0 1200 575" role="img" aria-labelledby="title desc">
<title id="title">Attention DP-A and MoE EP dataflow</title>
<desc id="desc">同一组GPU在Attention层使用DP-A：各Rank独立服务不同请求和本地MLA KV；进入MoE层则按Expert Parallelism进行Dispatch、Expert计算和Combine。MegaMoE是MoE层的通信与GEMM融合后端，不等同DP-A或EP。</desc>
<defs>
 <style>text{font-family:Inter,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}.over{font-size:12px;letter-spacing:1.5px;font-weight:700;fill:#177F75}.title{font-size:28px;font-weight:700;fill:#233843}.sub{font-size:14px;fill:#667D85}.heading{font-size:20px;font-weight:700;fill:#233843}.small{font-size:13px;fill:#6C7F87}.tag{font-size:12px;letter-spacing:.5px;font-weight:700;fill:#687B82}.strong{font-size:16px;font-weight:700;fill:#233843}.label{font-size:15px;font-weight:700;fill:#176F66}.warn{font-size:14px;font-weight:600;fill:#A45A38}</style>
 <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" stroke="#78909A" fill="none" stroke-width="1.5"/></marker>
</defs>
<rect width="1200" height="575" fill="#FBFAF7"/>
