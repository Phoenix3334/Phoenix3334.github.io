<title id="title">GPU NPU CPU execution comparison</title><desc id="desc">NVIDIA GPU SM, TMA, NVLink and CUDA; Ascend NPU AI Core, MTE, CANN; Arm Kunpeng CPU cache, NEON, NUMA. Functional analogy, not one to one hardware correspondence.</desc><defs><style>
text{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif}.ey{font-size:13px;font-weight:700;fill:#177F71;letter-spacing:1px}
.title{font-size:29px;font-weight:730;fill:#263843}.sub{font-size:15px;fill:#637784}.head{font-size:23px;font-weight:700;fill:#263843}.body{font-size:17px;fill:#263843}.tag{font-size:17px;font-weight:700}
</style><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#8095A0" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="562" fill="#FBFAF7"/><text x="40" y="38" class="ey" >HARDWARE EXECUTION / OVERVIEW</text><text x="40" y="81" class="title" >同一问题，三种硬件执行路径</text><text x="40" y="111" class="sub" >从计算单元、数据搬运到 Runtime：层级不同，优化方法也不同。</text><rect x="40" y="140" width="340" height="338" rx="10" fill="#FFFFFF" stroke="#D8DEDA" stroke-width="1.5"/><rect x="40" y="140" width="340" height="5" rx="2.5" fill="#2457C5"/><text x="58" y="178" class="head" >H200 / B300</text><text x="58" y="204" class="sub" >GPU / CUDA</text><rect x="58" y="223" width="304" height="46" rx="10" fill="#EDF3FC" stroke="#EDF3FC" stroke-width="1.5"/><text x="210" y="252" class="tag" text-anchor="middle" fill="#2457C5">SM · Tensor Core</text><rect x="58" y="283" width="304" height="46" rx="10" fill="#FBFAF7" stroke="#FBFAF7" stroke-width="1.5"/><text x="210" y="312" class="tag" text-anchor="middle" fill="#2457C5">TMA · Shared Memory</text><rect x="58" y="343" width="304" height="46" rx="10" fill="#EDF3FC" stroke="#EDF3FC" stroke-width="1.5"/><text x="210" y="372" class="tag" text-anchor="middle" fill="#2457C5">NVLink · Copy Engine</text><rect x="58" y="403" width="304" height="46" rx="10" fill="#FBFAF7" stroke="#FBFAF7" stroke-width="1.5"/><text x="210" y="432" class="tag" text-anchor="middle" fill="#2457C5">SGLang · CUDA</text><rect x="430" y="140" width="340" height="338" rx="10" fill="#FFFFFF" stroke="#D8DEDA" stroke-width="1.5"/><rect x="430" y="140" width="340" height="5" rx="2.5" fill="#177F71"/><text x="448" y="178" class="head" >Ascend 910B</text><text x="448" y="204" class="sub" >NPU / CANN</text><rect x="448" y="223" width="304" height="46" rx="10" fill="#EAF4EF" stroke="#EAF4EF" stroke-width="1.5"/><text x="600" y="252" class="tag" text-anchor="middle" fill="#177F71">AI Core · Cube / Vector</text><rect x="448" y="283" width="304" height="46" rx="10" fill="#FBFAF7" stroke="#FBFAF7" stroke-width="1.5"/><text x="600" y="312" class="tag" text-anchor="middle" fill="#177F71">MTE · UB / L1 / L0</text><rect x="448" y="343" width="304" height="46" rx="10" fill="#EAF4EF" stroke="#EAF4EF" stroke-width="1.5"/><text x="600" y="372" class="tag" text-anchor="middle" fill="#177F71">GM · HCCS 等</text><rect x="448" y="403" width="304" height="46" rx="10" fill="#FBFAF7" stroke="#FBFAF7" stroke-width="1.5"/><text x="600" y="432" class="tag" text-anchor="middle" fill="#177F71">Ascend C · 算子流水线</text><rect x="820" y="140" width="340" height="338" rx="10" fill="#FFFFFF" stroke="#D8DEDA" stroke-width="1.5"/><rect x="820" y="140" width="340" height="5" rx="2.5" fill="#B45F3D"/><text x="838" y="178" class="head" >Kunpeng 920</text><text x="838" y="204" class="sub" >CPU / Arm</text><rect x="838" y="223" width="304" height="46" rx="10" fill="#FBF1E9" stroke="#FBF1E9" stroke-width="1.5"/><text x="990" y="252" class="tag" text-anchor="middle" fill="#B45F3D">Arm Core · NEON</text><rect x="838" y="283" width="304" height="46" rx="10" fill="#FBFAF7" stroke="#FBFAF7" stroke-width="1.5"/><text x="990" y="312" class="tag" text-anchor="middle" fill="#B45F3D">L1 / L2 / L3 Cache</text><rect x="838" y="343" width="304" height="46" rx="10" fill="#FBF1E9" stroke="#FBF1E9" stroke-width="1.5"/><text x="990" y="372" class="tag" text-anchor="middle" fill="#B45F3D">DDR · NUMA</text><rect x="838" y="403" width="304" height="46" rx="10" fill="#FBFAF7" stroke="#FBFAF7" stroke-width="1.5"/><text x="990" y="432" class="tag" text-anchor="middle" fill="#B45F3D">MPI · OpenMP · perf</text><rect x="40" y="495" width="1120" height="48" rx="10" fill="#FFFFFF" stroke="#D8DEDA" stroke-width="1.5"/><text x="58" y="526" class="body" >共通目标：减少数据搬运，让计算尽量不停，再验证端到端收益。</text></svg>