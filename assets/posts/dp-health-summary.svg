<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="556" viewBox="0 0 1200 556" role="img" aria-labelledby="title desc"><title id="title">DP Health：吞吐下降不一定是 GPU 变慢</title><desc id="desc">探活污染路由状态 → Rank 负载失衡 → 有效 Batch 缩小</desc>
