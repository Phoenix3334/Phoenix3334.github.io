<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc"><title id="title">从 Issue 到上线：每个关口证明不同的事情</title><desc id="desc">CI 与 Review 共同把变更变成可验证、可追溯的交付</desc>
<defs><style>text{font-family:Inter,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}
.title{font-size:28px;font-weight:750;fill:#263A45}.subtitle{font-size:16px;fill:#667985}
.kicker{font-size:13px;letter-spacing:1.2px;font-weight:750;fill:#168273}
.heading{font-size:21px;font-weight:730;fill:#263A45}.body{font-size:17px;fill:#263A45}
.small{font-size:15px;fill:#667985}.tag{font-size:18px;font-weight:730}
.emphasis{font-size:18px;font-weight:740;fill:#263A45}</style>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" viewBox="0 0 9 9" orient="auto"><path d="M1 1 L8 4.5 L1 8" stroke="#8197A2" stroke-width="1.5" fill="none"/></marker></defs>
<rect x="0" y="0" width="1200" height="570" rx="0" fill="#FBFAF7" stroke="#FBFAF7" stroke-width="1.5"/>
<text x="40" y="38" class="kicker" >AT A GLANCE  /  系统总览</text><text x="40" y="83" class="title" >从 Issue 到上线：每个关口证明不同的事情</text>
<text x="40" y="117" class="subtitle" >CI 与 Review 共同把变更变成可验证、可追溯的交付</text>
<path d="M40 138 H1160" stroke="#D7DDDA" stroke-width="1.2"/>

<text x="42" y="178" class="heading" >一条代码变更的生命周期</text>
<rect x="42" y="204" width="198" height="70" rx="10" fill="#ECF2FB" stroke="#ECF2FB" stroke-width="1.5"/><text x="141" y="245" class="tag" text-anchor="middle" fill="#2457C5">Issue / 复现</text><path d="M241 238 L285 238" stroke="#8197A2" stroke-width="2.3" fill="none" marker-end="url(#arrow)"/>
<rect x="298" y="204" width="209" height="70" rx="10" fill="#ECF2FB" stroke="#ECF2FB" stroke-width="1.5"/><text x="402.5" y="245" class="tag" text-anchor="middle" fill="#2457C5">Branch / Commit</text><path d="M508 238 L552 238" stroke="#8197A2" stroke-width="2.3" fill="none" marker-end="url(#arrow)"/>
<rect x="564" y="204" width="185" height="70" rx="10" fill="#ECF2FB" stroke="#ECF2FB" stroke-width="1.5"/><text x="656.5" y="245" class="tag" text-anchor="middle" fill="#2457C5">PR</text><path d="M751 238 L802 238" stroke="#8197A2" stroke-width="2.3" fill="none" marker-end="url(#arrow)"/>
<rect x="814" y="189" width="343" height="178" rx="10" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.5"/>
<rect x="830" y="202" width="310" height="63" rx="10" fill="#EAF5F0" stroke="#EAF5F0" stroke-width="1.5"/><text x="985" y="239.5" class="tag" text-anchor="middle" fill="#168273">CI / 自动化测试</text>
<rect x="830" y="287" width="310" height="63" rx="10" fill="#FCF0E9" stroke="#FCF0E9" stroke-width="1.5"/><text x="985" y="324.5" class="tag" text-anchor="middle" fill="#B45D3C">人工 Code Review</text>
<path d="M984 367 L984 410" stroke="#8197A2" stroke-width="2.3" fill="none" marker-end="url(#arrow)"/>
<rect x="793" y="417" width="187" height="62" rx="10" fill="#ECF2FB" stroke="#ECF2FB" stroke-width="1.5"/><text x="886.5" y="454" class="tag" text-anchor="middle" fill="#2457C5">Merge</text><path d="M792 447 L746 447" stroke="#8197A2" stroke-width="2.3" fill="none" marker-end="url(#arrow)"/>
<rect x="503" y="417" width="220" height="62" rx="10" fill="#EAF5F0" stroke="#EAF5F0" stroke-width="1.5"/><text x="613" y="454" class="tag" text-anchor="middle" fill="#168273">Release / Deploy</text><path d="M501 447 L455 447" stroke="#8197A2" stroke-width="2.3" fill="none" marker-end="url(#arrow)"/>
<rect x="218" y="417" width="215" height="62" rx="10" fill="#EAF5F0" stroke="#EAF5F0" stroke-width="1.5"/><text x="325.5" y="454" class="tag" text-anchor="middle" fill="#168273">监控 / 回滚</text>
<rect x="42" y="500" width="1116" height="46" rx="9" fill="#FCF0E9" stroke="#E8CABD" stroke-width="1.5"/>
<text x="600" y="529" class="emphasis" text-anchor="middle" fill="#B45D3C">CI 通过 ≠ 已上线；AI 辅助写代码，提交者仍需对结果负责。</text>
</svg>