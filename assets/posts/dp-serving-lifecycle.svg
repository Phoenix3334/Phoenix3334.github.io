<text x="932" y="309" class="small">effective batches &amp; rank balance</text>
<path d="M858 223 H915" class="arrow" marker-end="url(#arr)"/>
<line x1="38" y1="387" x2="1162" y2="387" stroke="#D8D5CF"/>
<text x="44" y="422" class="rlabel">Historical failure:</text>
<text x="180" y="422" class="body">Health request mutated user routing state inside DPC, even when the Scheduler later skipped it.</text>
<text x="44" y="453" fill="#197F79" font-size="13" font-weight="700">Invariant after fix:</text>
<text x="180" y="453" class="body">The probe still routes, but does not change the user dispatch state or its load budget.</text>
