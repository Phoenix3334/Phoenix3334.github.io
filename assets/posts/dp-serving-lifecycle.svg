<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="492" viewBox="0 0 1200 492" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">DP Request Lifecycle and Control-plane State</title>
<desc id="diagram-desc">User requests and generation-health checks pass through the tokenizer and DataParallelController. Within DPC, independent user RR/LB and health RR states choose an active rank. The scheduler may skip health under busy load while user requests proceed through scheduling, DP Attention, MoE and model execution. The incorrect historical design let health mutate user routing state before the scheduler's skip.</desc>
<defs>
