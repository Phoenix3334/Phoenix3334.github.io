<rect x="288" y="132" width="4" height="224" rx="2" fill="#197F79"/>
<text x="308" y="158" class="section">DataParallelController</text>
<text x="308" y="178" class="small">Select an active DP rank</text>
<rect x="307" y="194" width="262" height="55" rx="5" fill="#EEF6F3" stroke="#C5DAD4"/>
