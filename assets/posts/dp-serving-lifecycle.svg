text{font-family:Inter,"Segoe UI",Arial,sans-serif}
.kicker{font-size:11px;fill:#197F79;font-weight:700;letter-spacing:1.4px}
.heading{font-size:24px;fill:#233440;font-weight:700}
.sub{font-size:13px;fill:#687985}
.section{font-size:15px;fill:#233440;font-weight:700}
.body{font-size:13px;fill:#445C67}
.small{font-size:12px;fill:#697C85}
.rlabel{font-size:13px;fill:#A7553C;font-weight:700}
.arrow{stroke:#6B848D;stroke-width:1.9;fill:none}
</style>
<marker id="arr" markerWidth="8" markerHeight="8" refX="6.4" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6B848D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrteal" markerWidth="8" markerHeight="8" refX="6.4" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#197F79" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
