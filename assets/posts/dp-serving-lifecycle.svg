<text x="321" y="237" class="small">Updated only by real user work</text>
<rect x="307" y="265" width="262" height="55" rx="5" fill="#FCF7F0" stroke="#E2D6C5"/>
<text x="321" y="288" class="section">Independent health RR state</text>
<text x="321" y="307" class="small">No user budget mutation</text>
