<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="663" viewBox="0 0 1200 663" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">Issue to release: the whole engineering loop</title><desc id="svgDesc">Macro workflow of software changes: issue/reproduce, code and local tests on a Git branch, open a pull request, parallel CI and human review with rework feedback, merge, release, operations verification, incident back to an issue. Neither CI nor merge alone is deployment.</desc>
<defs><style>
text{font-family:Inter,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}
.kicker{font-size:12px;font-weight:750;letter-spacing:1.6px;fill:#177F77}
.title{font-size:29px;font-weight:750;fill:#273944}
.subtitle{font-size:14px;fill:#617681}
.lane{font-size:13px;font-weight:700;letter-spacing:.5px;fill:#617681}
.heading{font-size:19px;font-weight:740;fill:#273944}
.body{font-size:16px;fill:#273944}
.small{font-size:13px;fill:#617681}
.tag{font-size:13px;font-weight:700;fill:#177F77}
.warn{font-size:15px;font-weight:700;fill:#B76040}
.metric{font-size:25px;font-weight:750;fill:#273944}
</style>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#82999C" stroke-width="1.6"/></marker>
</defs><rect width="1200" height="663" fill="#FBFAF7"/><text x="40" y="39" class="kicker" >ENGINEERING WORKFLOW  /  ISSUE → RELEASE</text>
<text x="40" y="79" class="title" >一次代码变更，如何真正进入生产系统？</text>
<text x="40" y="107" class="subtitle" >从问题到交付：自动化负责重复验证，Reviewer 负责设计判断，提交者始终对变更负责。</text>
<rect x="40" y="132" width="1120" height="29" rx="6" fill="#EFF0EC" stroke="#DCE1DC" stroke-width="1.4"/>
<text x="54" y="151" class="lane" >01  /  Developer · 问题与实现</text>
<rect x="43" y="175" width="335" height="117" rx="11" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.4"/><rect x="43" y="175" width="335" height="5" rx="3" fill="#3066B2"/><text x="60" y="206" class="lane" >#1</text><text x="60" y="239" class="heading" >Issue / 复现</text><text x="60" y="267" class="small" >现象 · 环境 · 预期/实际</text>
<rect x="430" y="175" width="335" height="117" rx="11" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.4"/><rect x="430" y="175" width="335" height="5" rx="3" fill="#3066B2"/><text x="447" y="206" class="lane" >#2</text><text x="447" y="239" class="heading" >Branch / Commit</text><text x="447" y="267" class="small" >最小修复 · 本地测试</text>
<rect x="817" y="175" width="339" height="117" rx="11" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.4"/><rect x="817" y="175" width="339" height="5" rx="3" fill="#3066B2"/><text x="834" y="206" class="lane" >#3</text><text x="834" y="239" class="heading" >Pull Request</text><text x="834" y="267" class="small" >说明变更 · 证据 · 风险</text>
<path d="M 379 234 H 425" fill="none" stroke="#82999C" stroke-width="2.2" marker-end="url(#arr)" stroke-linecap="round" /><path d="M 766 234 H 811" fill="none" stroke="#82999C" stroke-width="2.2" marker-end="url(#arr)" stroke-linecap="round" />
<rect x="40" y="321" width="1120" height="29" rx="6" fill="#EBF5F1" stroke="#C9DDD5" stroke-width="1.4"/>
<text x="54" y="340" class="lane" >02  /  Verification · 两条并行验收路径</text>
<rect x="101" y="362" width="445" height="108" rx="11" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.4"/><rect x="101" y="362" width="445" height="5" rx="3" fill="#177F77"/><text x="118" y="393" class="lane" >#4A</text><text x="118" y="426" class="heading" >CI / 自动化检查</text><text x="118" y="454" class="small" >Lint · Unit · Integration · GPU</text>
<rect x="653" y="362" width="445" height="108" rx="11" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.4"/><rect x="653" y="362" width="445" height="5" rx="3" fill="#B76040"/><text x="670" y="393" class="lane" >#4B</text><text x="670" y="426" class="heading" >Review / 人工审查</text><text x="670" y="454" class="small" >语义 · 正确性 · 边界 · 可维护性</text>
<path d="M 945 292 V 306 H 324 V 355" fill="none" stroke="#82999C" stroke-width="2.2" marker-end="url(#arr)" stroke-linecap="round" />
<path d="M 945 292 V 355" fill="none" stroke="#82999C" stroke-width="2.2" marker-end="url(#arr)" stroke-linecap="round" />
<path d="M 320 473 V 500 H 108 V 233 H 43" stroke="#B76040" stroke-width="1.9" fill="none" stroke-dasharray="6 6"/>
<text x="135" y="496" class="small" >失败 / 修改后再跑</text>
<path d="M 876 473 V 500 H 108" stroke="#B76040" stroke-width="1.9" fill="none" stroke-dasharray="6 6"/>
<rect x="40" y="519" width="1120" height="29" rx="6" fill="#FBF0E8" stroke="#E9CEC1" stroke-width="1.4"/>
<text x="54" y="538" class="lane" >03  /  Delivery · 只有通过门禁才能合并；部署与运行时验证是后续步骤</text>
<rect x="43" y="556" width="335" height="95" rx="11" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.4"/><rect x="43" y="556" width="335" height="5" rx="3" fill="#B76040"/><text x="60" y="587" class="lane" ></text><text x="60" y="620" class="heading" >Merge</text><text x="60" y="648" class="small" >整合代码到主分支</text><rect x="431" y="556" width="335" height="95" rx="11" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.4"/><rect x="431" y="556" width="335" height="5" rx="3" fill="#B76040"/><text x="448" y="587" class="lane" ></text><text x="448" y="620" class="heading" >Release / CD</text><text x="448" y="648" class="small" >构建产物 · 发布 / 部署</text><rect x="819" y="556" width="337" height="95" rx="11" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.4"/><rect x="819" y="556" width="337" height="5" rx="3" fill="#B76040"/><text x="836" y="587" class="lane" ></text><text x="836" y="620" class="heading" >Observe</text><text x="836" y="648" class="small" >监控回归 · 反馈新 Issue</text>
<path d="M 323 475 V 509 H 214 V 550" fill="none" stroke="#82999C" stroke-width="2.2" marker-end="url(#arr)" stroke-linecap="round" />
<path d="M 875 475 V 509 H 214" fill="none" stroke="#177F77" stroke-width="2.2" marker-end="url(#arr)" stroke-linecap="round" />
<path d="M 379 607 H 425" fill="none" stroke="#82999C" stroke-width="2.2" marker-end="url(#arr)" stroke-linecap="round" /><path d="M 767 607 H 813" fill="none" stroke="#82999C" stroke-width="2.2" marker-end="url(#arr)" stroke-linecap="round" />
<text x="40" y="661" class="small" >闭环的核心不是“PR 绿了”，而是行为有证据、改动可解释、上线后可追踪。</text>
</svg>