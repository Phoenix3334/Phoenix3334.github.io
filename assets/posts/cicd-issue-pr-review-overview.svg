<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="753" viewBox="0 0 1200 753" role="img" aria-labelledby="diagramTitle diagramDesc">
<title id="diagramTitle">从 Issue 到上线：完整代码变更的工程链路</title>
<desc id="diagramDesc">Issue 复现、Branch/Commit、Pull Request 顺序发生；PR 进入并行的 CI 自动化检查与人工 Code Review，两条路径通过后才能 Merge；随后 Release/Deploy 和 Observe/Rollback。CI 通过不是已经上线，AI 辅助代码也不能替代提交者的责任。</desc>
<defs><style>
text{font-family:Inter,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}
.kicker{fill:#167E71;font-size:12px;font-weight:750;letter-spacing:1.4px}
.title{fill:#263843;font-size:29px;font-weight:740}
.subtitle{fill:#637885;font-size:15px}
.lane{fill:#263843;font-size:15px;font-weight:740}
.step{fill:#637885;font-size:13px;font-weight:690}
.cardTitle{fill:#263843;font-size:22px;font-weight:740}
.caption{fill:#637885;font-size:15px}
.tiny{font-size:13px;font-weight:660}
.takeaway{font-size:19px;font-weight:740}
.footer{fill:#263843;font-size:17px;font-weight:560}
</style>
<marker id="arr" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M1 1 L8.5 5 L1 9" fill="none" stroke="#79919C" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="1200" height="753" fill="#FBFAF7"/>

<text x="42" y="38" class="kicker" >ENGINEERING WORKFLOW / GIT · PR · CI/CD</text>
<text x="42" y="83" class="title" >从 Issue 到上线：一次代码变更的完整链路</text>
<text x="42" y="111" class="subtitle" >CI 与 Review 并行把关；Merge 之后，还有交付和生产验证。</text>
<rect x="42" y="132" width="1116" height="33" rx="6" fill="#EFEEEA" stroke="#E5E2DB" stroke-width="1.45"/>
<text x="57" y="154" class="lane" >01  /  提出问题与实现</text>
<rect x="42" y="177" width="338" height="104" rx="11" fill="#FFFFFF" stroke="#D6DEDA" stroke-width="1.45"/><rect x="42" y="177" width="338" height="5" rx="2.5" fill="#2457C5"/>
 <text x="61" y="206" class="step" >01</text><text x="61" y="246" class="cardTitle" >Issue / 复现</text>
 <text x="61" y="262" class="caption" >现象 · 环境 · 预期与实际</text>
<rect x="431" y="177" width="338" height="104" rx="11" fill="#FFFFFF" stroke="#D6DEDA" stroke-width="1.45"/><rect x="431" y="177" width="338" height="5" rx="2.5" fill="#2457C5"/>
 <text x="450" y="206" class="step" >02</text><text x="450" y="246" class="cardTitle" >Branch / Commit</text>
 <text x="450" y="262" class="caption" >最小修改 · 本地测试</text>
<rect x="820" y="177" width="338" height="104" rx="11" fill="#FFFFFF" stroke="#D6DEDA" stroke-width="1.45"/><rect x="820" y="177" width="338" height="5" rx="2.5" fill="#2457C5"/>
 <text x="839" y="206" class="step" >03</text><text x="839" y="246" class="cardTitle" >Pull Request</text>
 <text x="839" y="262" class="caption" >变更说明 · 测试证据 · 风险</text>
<path d="M380 229 H423" fill="none" stroke="#79919C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M769 229 H812" fill="none" stroke="#79919C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<!-- PR turns into two parallel checks -->
<rect x="42" y="325" width="1116" height="31" rx="6" fill="#E9F4EF" stroke="#D2E5DC" stroke-width="1.45"/>
<text x="57" y="347" class="lane" >02  /  并行验证</text>
<path d="M989 281 V309 H330" fill="none" stroke="#79919C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M330 309 V360" fill="none" stroke="#79919C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M870 309 V360" fill="none" stroke="#79919C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="110" y="365" width="439" height="101" rx="11" fill="#FFFFFF" stroke="#D6DEDA" stroke-width="1.45"/><rect x="110" y="365" width="439" height="5" rx="2.5" fill="#167E71"/>
 <text x="129" y="394" class="step" >04A</text><text x="129" y="434" class="cardTitle" >CI / 自动化检查</text>
 <text x="129" y="447" class="caption" >Lint · Unit · Build · Integration</text>
<rect x="651" y="365" width="439" height="101" rx="11" fill="#FFFFFF" stroke="#D6DEDA" stroke-width="1.45"/><rect x="651" y="365" width="439" height="5" rx="2.5" fill="#B65739"/>
 <text x="670" y="394" class="step" >04B</text><text x="670" y="434" class="cardTitle" >Code Review</text>
 <text x="670" y="447" class="caption" >设计 · 正确性 · 兼容与维护</text>
<rect x="42" y="521" width="1116" height="31" rx="6" fill="#FBF0EA" stroke="#EBCFC2" stroke-width="1.45"/>
<text x="57" y="543" class="lane" >03  /  合并、交付与运行</text>
<path d="M329 466 V497 H321 V557" fill="none" stroke="#167E71" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M870 466 V497 H321" fill="none" stroke="#B65739" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<text x="530" y="488" class="tiny" fill="#167E71">通过后合并</text>
<text x="736" y="488" class="tiny" fill="#B65739">不通过 → 修改并重验</text>
<rect x="42" y="558" width="338" height="102" rx="11" fill="#FFFFFF" stroke="#D6DEDA" stroke-width="1.45"/><rect x="42" y="558" width="338" height="5" rx="2.5" fill="#B65739"/>
 <text x="61" y="587" class="step" >05</text><text x="61" y="627" class="cardTitle" >Merge</text>
 <text x="61" y="641" class="caption" >合入目标分支</text>
<rect x="431" y="558" width="338" height="102" rx="11" fill="#FFFFFF" stroke="#D6DEDA" stroke-width="1.45"/><rect x="431" y="558" width="338" height="5" rx="2.5" fill="#B65739"/>
 <text x="450" y="587" class="step" >06</text><text x="450" y="627" class="cardTitle" >Release / Deploy</text>
 <text x="450" y="641" class="caption" >构建 · 发布 · 部署</text>
<rect x="820" y="558" width="338" height="102" rx="11" fill="#FFFFFF" stroke="#D6DEDA" stroke-width="1.45"/><rect x="820" y="558" width="338" height="5" rx="2.5" fill="#B65739"/>
 <text x="839" y="587" class="step" >07</text><text x="839" y="627" class="cardTitle" >Observe / Rollback</text>
 <text x="839" y="641" class="caption" >监控 · 回滚 · 反馈 Issue</text>
<path d="M380 609 H423" fill="none" stroke="#79919C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M769 609 H812" fill="none" stroke="#79919C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<rect x="42" y="680" width="1116" height="53" rx="8" fill="#FFFFFF" stroke="#D6DEDA" stroke-width="1.45"/>
<text x="63" y="712" class="takeaway" fill="#B65739">CI 通过 ≠ 已上线</text>
<path d="M363 691 V722" fill="none" stroke="#E2D6CF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
<text x="390" y="712" class="footer" >AI 可以辅助写代码，提交者仍需对修改和验证负责。</text>

</svg>