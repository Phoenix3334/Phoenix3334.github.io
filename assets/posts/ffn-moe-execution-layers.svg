<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="564" viewBox="0 0 1200 564" role="img" aria-labelledby="ttl dsc"><title id="ttl">Dense FFN to DeepSeekMoE and MegaMoE</title><desc id="dsc">Three levels: Dense SwiGLU for each token; Routed MoE chooses top-k experts and combines output; expert parallelism distributes expert weights and MegaMoE overlaps dispatch/compute/combine. Model math vs parallel strategy vs execution backend.</desc><defs><style>text{font-family:Inter,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}.kicker{fill:#168171;font-size:13px;font-weight:720;letter-spacing:1.1px}.title{fill:#263A45;font-size:29px;font-weight:740}.sub{fill:#657985;font-size:15px}.head{fill:#263A45;font-size:22px;font-weight:740}.label{font-size:17px;font-weight:730}.note{fill:#657985;font-size:15px}.fact{fill:#263A45;font-size:18px;font-weight:650}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#8096A0" stroke-width="1.5"/></marker></defs><rect width="1200" height="564" fill="#FBFAF7"/><text x="40" y="38" class="kicker" >FFN → MOE → EP → MEGAMOE</text><text x="40" y="83" class="title" >同一个 FFN，如何从密集计算变成分布式专家执行？</text><text x="40" y="114" class="sub" >模型结构决定计算什么，EP 决定在哪里算，MegaMoE 决定怎么协同执行。</text><rect x="40" y="149" width="340" height="311" rx="10" fill="#FFFFFF" stroke="#D6DDD9" stroke-width="1.5"/><rect x="40" y="149" width="340" height="5" rx="3" fill="#2457C5"/><text x="60" y="194" class="head" >01 · Dense FFN</text><rect x="62" y="220" width="296" height="58" rx="10" fill="#ECF2FC" stroke="#ECF2FC" stroke-width="1.5"/><text x="210" y="255" class="label" text-anchor="middle" fill="#2457C5">每个 Token</text><path d="M210 278 L210 300" stroke="#8096A0" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/><rect x="62" y="310" width="296" height="58" rx="10" fill="#F3F4F2" stroke="#F3F4F2" stroke-width="1.5"/><text x="210" y="345" class="label" text-anchor="middle" fill="#2457C5">同一组 SwiGLU 权重</text><path d="M210 369 L210 389" stroke="#8096A0" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/><rect x="62" y="401" width="296" height="44" rx="10" fill="#ECF2FC" stroke="#ECF2FC" stroke-width="1.5"/><text x="210" y="429" class="label" text-anchor="middle" fill="#2457C5">Up / Gate → Down</text><rect x="430" y="149" width="340" height="311" rx="10" fill="#FFFFFF" stroke="#D6DDD9" stroke-width="1.5"/><rect x="430" y="149" width="340" height="5" rx="3" fill="#168171"/><text x="450" y="194" class="head" >02 · Routed MoE</text><rect x="452" y="220" width="296" height="58" rx="10" fill="#E9F5EF" stroke="#E9F5EF" stroke-width="1.5"/><text x="600" y="255" class="label" text-anchor="middle" fill="#168171">Router → Top-k</text><path d="M600 278 L600 300" stroke="#8096A0" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/><rect x="452" y="310" width="296" height="58" rx="10" fill="#F3F4F2" stroke="#F3F4F2" stroke-width="1.5"/><text x="600" y="345" class="label" text-anchor="middle" fill="#168171">选中的专家 FFN</text><path d="M600 369 L600 389" stroke="#8096A0" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/><rect x="452" y="401" width="296" height="44" rx="10" fill="#E9F5EF" stroke="#E9F5EF" stroke-width="1.5"/><text x="600" y="429" class="label" text-anchor="middle" fill="#168171">加权 Combine</text><rect x="820" y="149" width="340" height="311" rx="10" fill="#FFFFFF" stroke="#D6DDD9" stroke-width="1.5"/><rect x="820" y="149" width="340" height="5" rx="3" fill="#B55D3A"/><text x="840" y="194" class="head" >03 · EP / MegaMoE</text><rect x="842" y="220" width="296" height="58" rx="10" fill="#FBF0E9" stroke="#FBF0E9" stroke-width="1.5"/><text x="990" y="255" class="label" text-anchor="middle" fill="#B55D3A">Dispatch 到 Expert Rank</text><path d="M990 278 L990 300" stroke="#8096A0" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/><rect x="842" y="310" width="296" height="58" rx="10" fill="#F3F4F2" stroke="#F3F4F2" stroke-width="1.5"/><text x="990" y="345" class="label" text-anchor="middle" fill="#B55D3A">GEMM 与通信重叠</text><path d="M990 369 L990 389" stroke="#8096A0" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/><rect x="842" y="401" width="296" height="44" rx="10" fill="#FBF0E9" stroke="#FBF0E9" stroke-width="1.5"/><text x="990" y="429" class="label" text-anchor="middle" fill="#B55D3A">Combine 回原 Token</text><rect x="40" y="478" width="1120" height="66" rx="10" fill="#FFFFFF" stroke="#D6DDD9" stroke-width="1.5"/><text x="60" y="506" class="fact" >共享专家 + Routed Expert 决定容量与特化；EP 与 MegaMoE 决定分布式执行开销。</text><text x="60" y="531" class="note" >两条分界：MoE ≠ EP；EP ≠ MegaMoE。</text></svg>