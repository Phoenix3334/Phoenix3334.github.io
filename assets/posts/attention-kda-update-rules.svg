<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Linear DeltaNet GDN KDA state updates</title><desc id="desc">Linear accumulates, DeltaNet uses reconstruction residual, GDN scalar per-head forget gate, KDA per-key-channel diagonal forget gate; state has fixed dimensions versus sequence length.</desc><defs><style>text{font-family:Inter,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}.kicker{font-size:13px;letter-spacing:1.4px;font-weight:740;fill:#178173}.title{font-size:28px;font-weight:740;fill:#263A45}.sub{font-size:16px;fill:#667983}.name{font-size:23px;font-weight:730;fill:#263A45}.note{font-size:16px;fill:#667983}.value{font-size:22px;font-weight:760}.small{font-size:14px;fill:#667983}.tag{font-size:18px;font-weight:720;fill:#263A45}</style><marker id="arr" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8.7 5 L1 9" fill="none" stroke="#82949C" stroke-width="1.5" stroke-linecap="round"/></marker></defs><rect width="1200" height="600" fill="#FBFAF7"/><text x="42" y="38" class="kicker" >RECURRENT STATE / UPDATE RULES</text><text x="42" y="83" class="title" >Linear → DeltaNet → GDN → KDA：区别在怎么写、怎么忘</text><text x="42" y="111" class="sub" >固定大小 State 不等于没有记忆成本；这里只说明一层一头的更新语义。</text><rect x="42" y="150" width="1116" height="78" rx="9" fill="#FFF" stroke="#D9DEDB" stroke-width="1.4"/><rect x="42" y="150" width="6" height="78" rx="3" fill="#2457C5"/><text x="64" y="179" class="name" >Linear</text><text x="64" y="204" class="small" >累加写入</text><text x="315" y="197" class="tag" >S ← S + v kᵀ</text><text x="914" y="197" class="note" >只加不改</text><rect x="42" y="243" width="1116" height="78" rx="9" fill="#FFF" stroke="#D9DEDB" stroke-width="1.4"/><rect x="42" y="243" width="6" height="78" rx="3" fill="#178173"/><text x="64" y="272" class="name" >DeltaNet</text><text x="64" y="297" class="small" >残差覆写</text><text x="315" y="290" class="tag" >S ← S + β(v−Sk)kᵀ</text><text x="914" y="290" class="note" >按 Key 修正</text><rect x="42" y="336" width="1116" height="78" rx="9" fill="#FFF" stroke="#D9DEDB" stroke-width="1.4"/><rect x="42" y="336" width="6" height="78" rx="3" fill="#B65A3C"/><text x="64" y="365" class="name" >GDN</text><text x="64" y="390" class="small" >按 Head 遗忘</text><text x="315" y="383" class="tag" >S̄ ← αS；再 Delta</text><text x="914" y="383" class="note" >每 Head 一个 α</text><rect x="42" y="429" width="1116" height="78" rx="9" fill="#FFF" stroke="#D9DEDB" stroke-width="1.4"/><rect x="42" y="429" width="6" height="78" rx="3" fill="#6975B6"/><text x="64" y="458" class="name" >KDA</text><text x="64" y="483" class="small" >按 Channel 遗忘</text><text x="315" y="476" class="tag" >S̄ ← S·Diag(α)；再 Delta</text><text x="914" y="476" class="note" >每 Key 通道一个 α</text><rect x="42" y="535" width="1116" height="48" rx="9" fill="#E9F4F0" stroke="#D0E3DB" stroke-width="1.4"/><text x="64" y="565" class="note" >KDA 仍然是递推状态；Chunk-wise 通过仿射变换把部分计算改造成可并行矩阵运算。</text></svg>