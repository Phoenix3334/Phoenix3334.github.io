<text x="475" y="334" class="heading" >月建设成本</text><text x="475" y="378" class="number" >约 6.36 万元</text><text x="475" y="404" class="small" >381.66 / 60 个月</text>
<path d="M781 362 L815 362" stroke="#71828A" stroke-width="2.2" fill="none" marker-end="url(#arr)"/>
<rect x="830" y="302" width="330" height="120" rx="9" fill="#FAF0EA" stroke="#E8C8B9" />
