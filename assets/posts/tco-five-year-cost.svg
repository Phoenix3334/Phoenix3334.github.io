<rect width="1200" height="530" fill="#FBFAF7"/>
<text x="40" y="40" class="kicker" >COST BRIDGE / SOURCE REPORT + ARITHMETIC</text>
<text x="40" y="80" class="title" >从五年建设投入，走到每台设备的月报价</text>
<text x="40" y="106" class="subtitle" >950DT 风冷方案 · 金额单位：万元 / 台 · 原报告投资模型与算术复核</text>
<rect x="40" y="142" width="340" height="114" rx="8" fill="#FFFFFF" stroke="#D8D5CF" /><rect x="40" y="142" width="340" height="5" rx="5" fill="#197F79"/><text x="58" y="182" class="body" >设备 + 五年维保</text><text x="58" y="226" class="number" >319.12</text><rect x="430" y="142" width="340" height="114" rx="8" fill="#FFFFFF" stroke="#D8D5CF" /><rect x="430" y="142" width="340" height="5" rx="5" fill="#2457C5"/><text x="448" y="182" class="body" >网络、通算配套</text><text x="448" y="226" class="number" >11.60</text><rect x="820" y="142" width="340" height="114" rx="8" fill="#FFFFFF" stroke="#D8D5CF" /><rect x="820" y="142" width="340" height="5" rx="5" fill="#B65334"/><text x="838" y="182" class="body" >五年 IDC 费用</text><text x="838" y="226" class="number" >50.94</text>
