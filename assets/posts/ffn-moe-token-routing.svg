<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="559" viewBox="0 0 1200 559" role="img" aria-labelledby="ttl dsc"><title id="ttl">MoE top-k routing and expert parallelism</title><desc id="dsc">Tokens A and B are scored by router then select top-k experts, dispatched/packed to rank 0 or rank 1 where different expert FFNs execute, then outputs weighted and recombined. Diagram is conceptual.</desc><defs><style>text{font-family:Inter,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}.kicker{fill:#168171;font-size:13px;font-weight:720;letter-spacing:1.1px}.title{fill:#263A45;font-size:29px;font-weight:740}.sub{fill:#657985;font-size:15px}.head{fill:#263A45;font-size:22px;font-weight:740}.label{font-size:17px;font-weight:730}.note{fill:#657985;font-size:15px}.fact{fill:#263A45;font-size:18px;font-weight:650}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#8096A0" stroke-width="1.5"/></marker></defs><rect width="1200" height="559" fill="#FBFAF7"/><text x="40" y="38" class="kicker" >TOKEN ROUTING / RANKS</text><text x="40" y="82" class="title" >一次 MoE Forward：Token 如何找到专家，再回到原位置？</text><text x="40" y="110" class="sub" >示意：两枚 Token、4 个 Routed Expert、Top-2；数字不是特定模型配置。</text><rect x="45" y="159" width="187" height="64" rx="10" fill="#ECF2FC" stroke="#ECF2FC" stroke-width="1.5"/><text x="138.5" y="197" class="label" text-anchor="middle" fill="#2457C5">Tokens A, B</text><path d="M232 191 L310 191" stroke="#8096A0" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/><rect x="320" y="159" width="196" height="64" rx="10" fill="#ECF2FC" stroke="#ECF2FC" stroke-width="1.5"/><text x="418" y="197" class="label" text-anchor="middle" fill="#2457C5">Router scores</text><path d="M519 191 L591 191" stroke="#8096A0" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/><rect x="604" y="159" width="225" height="64" rx="10" fill="#E9F5EF" stroke="#E9F5EF" stroke-width="1.5"/><text x="716.5" y="197" class="label" text-anchor="middle" fill="#168171">Top-k indices</text><path d="M830 191 L900 191" stroke="#8096A0" stroke-width="2.1" fill="none" marker-end="url(#arrow)"/><rect x="913" y="159" width="242" height="64" rx="10" fill="#E9F5EF" stroke="#E9F5EF" stroke-width="1.5"/><text x="1034" y="197" class="label" text-anchor="middle" fill="#168171">Dispatch / Pack</text><text x="40" y="275" class="head" >Expert Parallel：不同 Rank 持有不同专家权重</text><rect x="58" y="302" width="236" height="68" rx="10" fill="#ECF2FC" stroke="#ECF2FC" stroke-width="1.5"/><text x="176" y="342" class="label" text-anchor="middle" fill="#2457C5">Rank 0 · E0</text><text x="176" y="397" class="note" text-anchor="middle">SwiGLU FFN</text><rect x="340" y="302" width="236" height="68" rx="10" fill="#ECF2FC" stroke="#ECF2FC" stroke-width="1.5"/><text x="458" y="342" class="label" text-anchor="middle" fill="#2457C5">Rank 0 · E1</text><text x="458" y="397" class="note" text-anchor="middle">SwiGLU FFN</text><rect x="623" y="302" width="236" height="68" rx="10" fill="#E9F5EF" stroke="#E9F5EF" stroke-width="1.5"/><text x="741" y="342" class="label" text-anchor="middle" fill="#168171">Rank 1 · E2</text><text x="741" y="397" class="note" text-anchor="middle">SwiGLU FFN</text><rect x="906" y="302" width="236" height="68" rx="10" fill="#E9F5EF" stroke="#E9F5EF" stroke-width="1.5"/><text x="1024" y="342" class="label" text-anchor="middle" fill="#168171">Rank 1 · E3</text><text x="1024" y="397" class="note" text-anchor="middle">SwiGLU FFN</text><rect x="40" y="441" width="1120" height="64" rx="10" fill="#FBF0E9" stroke="#E7CDBF" stroke-width="1.5"/><text x="63" y="468" class="fact" >Combine：按原 Token 聚合被选专家的输出</text><text x="63" y="494" class="note" >路由权重只加权实际选中专家；Shared Expert 可另行贡献输出。</text><text x="40" y="538" class="note" >生产系统还需：跨 Rank All-to-All、负载均衡、容量与 Padding、通信/计算重叠。</text></svg>