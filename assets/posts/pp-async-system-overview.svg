<rect x="424" y="531" width="353" height="99" rx="8" fill="#FFFFFF" stroke="#D9DEDC" stroke-width="1.4"/>
<rect x="808" y="531" width="352" height="99" rx="8" fill="#FFFFFF" stroke="#D9DEDC" stroke-width="1.4"/>
