<rect x="660" y="313" width="478" height="75" rx="7" fill="#FFFFFF" stroke="#C7DDD6" stroke-width="1.4"/>
<text x="680" y="337" class="key" >Forward Stream · run_batch(A)</text><text x="680" y="365" class="body" >继续 Transformer Forward</text>
<rect x="660" y="417" width="478" height="44" rx="7" fill="#FFFFFF" stroke="#D9DEDC" stroke-width="1.4"/>
