<text x="40" y="79" class="title" >异步 PP：一份 Hidden States 跨越哪些边界？</text>
<text x="40" y="107" class="sub" >同一条请求跨 Stage 传递；不同 Microbatch 的通信和 Forward 可以在 GPU 上交叠。</text>
<rect x="40" y="138" width="522" height="369" rx="8" fill="#FFFFFF" stroke="#D9DEDC" stroke-width="1.4"/><rect x="638" y="138" width="522" height="369" rx="8" fill="#FFFFFF" stroke="#D9DEDC" stroke-width="1.4"/>
<rect x="40" y="138" width="522" height="6" rx="3" fill="#345B9B"/>
<rect x="638" y="138" width="522" height="6" rx="3" fill="#197F79"/>
<text x="62" y="174" class="section" >GPU 0 · PP Stage 0</text><text x="660" y="174" class="section" >GPU 1 · PP Stage 1</text>
<text x="62" y="195" class="small" >Producer / 上游计算</text><text x="660" y="195" class="small" >Consumer / 下游计算</text>
<rect x="62" y="213" width="478" height="51" rx="6" fill="#EDF2FA" stroke="#C7D6E9" stroke-width="1.4"/>
<text x="80" y="233" class="label" >CPU 调度 / enqueue</text><text x="80" y="252" class="body" >Microbatch A、B</text>
<rect x="62" y="291" width="478" height="68" rx="7" fill="#FFFFFF" stroke="#C6D6E8" stroke-width="1.4"/>
<text x="80" y="315" class="key" >Forward Stream</text><text x="80" y="343" class="body" >Transformer 前半层  →  Hidden States A</text>
<rect x="62" y="393" width="478" height="67" rx="7" fill="#EDF2FA" stroke="#C7D6E9" stroke-width="1.4"/>
<text x="80" y="418" class="key" >Comm Stream · send</text><text x="80" y="445" class="body" >A 的 Tensor 交给下一 Stage</text>
