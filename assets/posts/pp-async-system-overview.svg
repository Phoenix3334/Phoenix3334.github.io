<text x="58" y="565" class="section" >① CPU ≠ GPU</text><text x="58" y="593" class="small" >提交完成不等于 GPU 执行完成</text>
<text x="442" y="565" class="section" >② Execution ordering</text><text x="442" y="593" class="small" >事件 / Wait 确保先生产再消费</text>
<text x="826" y="565" class="section" >③ Memory lifetime</text><text x="826" y="593" class="small" >record_stream 保护跨流显存使用</text></svg>