<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="559" viewBox="0 0 1200 559" role="img" aria-labelledby="title desc"><title id="title">Attention：存多少、读哪些、怎么更新？</title><desc id="desc">MHA / GQA / MLA、DSA、KDA 是不同维度，可以在同一模型里组合</desc>
