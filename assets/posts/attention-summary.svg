<text x="40" y="38" class="kicker" >AT A GLANCE  /  系统总览</text><text x="40" y="83" class="title" >Attention：存多少、读哪些、怎么更新？</text>
<text x="40" y="117" class="subtitle" >MHA / GQA / MLA、DSA、KDA 是不同维度，可以在同一模型里组合</text>
<path d="M40 138 H1160" stroke="#D7DDDA" stroke-width="1.2"/>

<text x="40" y="177" class="heading" >不是替代关系，而是三个不同问题</text>
<rect x="40" y="198" width="350" height="222" rx="10" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.5"/><rect x="424" y="198" width="350" height="222" rx="10" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.5"/><rect x="808" y="198" width="350" height="222" rx="10" fill="#FFFFFF" stroke="#D7DDDA" stroke-width="1.5"/>
<text x="62" y="238" class="heading" >历史怎么存？</text><text x="445" y="238" class="heading" >本步读哪些？</text><text x="830" y="238" class="heading" >历史怎么更新？</text>
<text x="62" y="275" class="body" >MHA / MQA / GQA</text><text x="62" y="308" class="body" >MLA 压缩 KV</text>
<text x="445" y="275" class="body" >Full：读取完整历史</text><text x="445" y="308" class="body" >DSA：Indexer + Top-k</text>
<text x="830" y="275" class="body" >KDA：递推 State</text><text x="830" y="308" class="body" >不用每步读取全部 KV</text>
