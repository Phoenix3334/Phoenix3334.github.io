<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">从性能到产能，再到成本</title>
<desc id="desc">极简系统概览：推理性能测量，通过SLO约束筛选有效服务产能，再结合基础设施投入衡量单位Token成本。左侧的波动曲线、中段收敛的服务流与右侧的成本环代表三层概念。本图为抽象方法示意，不包含额外的实测数据。</desc>
<defs>
  <radialGradient id="blueGlow"><stop offset="0" stop-color="#267AA8" stop-opacity=".31"/><stop offset="1" stop-color="#267AA8" stop-opacity="0"/></radialGradient>
  <radialGradient id="greenGlow"><stop offset="0" stop-color="#15A79C" stop-opacity=".21"/><stop offset="1" stop-color="#15A79C" stop-opacity="0"/></radialGradient>
  <radialGradient id="amberGlow"><stop offset="0" stop-color="#D8A260" stop-opacity=".20"/><stop offset="1" stop-color="#D8A260" stop-opacity="0"/></radialGradient>
  <linearGradient id="flowLine" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0" stop-color="#6BACE7"/><stop offset=".47" stop-color="#7DE2C5"/><stop offset="1" stop-color="#F0BF83"/>
  </linearGradient>
  <linearGradient id="waveFill" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0" stop-color="#64AEE8" stop-opacity=".13"/><stop offset="1" stop-color="#64AEE8" stop-opacity="0"/>
  </linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="23"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="540" fill="#0B1420"/>
<ellipse cx="240" cy="355" rx="350" ry="300" fill="url(#blueGlow)"/>
<ellipse cx="620" cy="380" rx="345" ry="270" fill="url(#greenGlow)"/>
<ellipse cx="1010" cy="343" rx="290" ry="270" fill="url(#amberGlow)"/>
<line x1="74" y1="179" x2="74" y2="470" stroke="#C7D6DA" stroke-width="0.65" opacity="0.08"/><line x1="155" y1="179" x2="155" y2="470" stroke="#C7D6DA" stroke-width="0.65" opacity="0.08"/><line x1="236" y1="179" x2="236" y2="470" stroke="#C7D6DA" stroke-width="0.65" opacity="0.08"/><line x1="317" y1="179" x2="317" y2="470" stroke="#C7D6DA" stroke-width="0.65" opacity="0.08"/><line x1="398" y1="179" x2="398" y2="470" stroke="#C7D6DA" stroke-width="0.65" opacity="0.08"/><line x1="479" y1="179" x2="479" y2="470" stroke="#C7D6DA" stroke-width="0.65" opacity="0.08"/><line x1="560" y1="179" x2="560" y2="470" stroke="#C7D6DA" stroke-width="0.65" opacity="0.08"/><line x1="641" y1="179" x2="641" y2="470" stroke="#C7D6DA" stroke-width="0.65" opacity="0.08"/><line x1="722" y1="179" x2="722" y2="470" stroke="#C7D6DA" stroke-width="0.65" opacity="0.08"/><line x1="803" y1="179" x2="803" y2="470" stroke="#C7D6DA" stroke-width="0.65" opacity="0.08"/><line x1="884" y1="179" x2="884" y2="470" stroke="#C7D6DA" stroke-width="0.65" opacity="0.08"/><line x1="965" y1="179" x2="965" y2="470" stroke="#C7D6DA" stroke-width="0.65" opacity="0.08"/><line x1="1046" y1="179" x2="1046" y2="470" stroke="#C7D6DA" stroke-width="0.65" opacity="0.08"/><line x1="1127" y1="179" x2="1127" y2="470" stroke="#C7D6DA" stroke-width="0.65" opacity="0.08"/><line x1="70" y1="230" x2="1130" y2="230" stroke="#C7D6DA" stroke-width="0.65" opacity="0.08"/><line x1="70" y1="287" x2="1130" y2="287" stroke="#C7D6DA" stroke-width="0.65" opacity="0.08"/><line x1="70" y1="344" x2="1130" y2="344" stroke="#C7D6DA" stroke-width="0.65" opacity="0.08"/><line x1="70" y1="401" x2="1130" y2="401" stroke="#C7D6DA" stroke-width="0.65" opacity="0.08"/><line x1="70" y1="458" x2="1130" y2="458" stroke="#C7D6DA" stroke-width="0.65" opacity="0.08"/>
<line x1="70" y1="164" x2="1130" y2="164" stroke="#A2BAC5" stroke-opacity=".23"/>
<text x="72" y="53" font-size="13" font-weight="650" fill="#88AAA9" letter-spacing="2.4" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif">LLM SYSTEMS  /  ECONOMICS</text>
<text x="72" y="121" font-size="48" font-weight="640" fill="#F5F2EB" letter-spacing="-.8" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif">从性能，到产能，再到成本</text>
<text x="1061" y="53" font-size="12" font-weight="550" fill="#7C95A4" letter-spacing="1.3" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif">01 — 03</text>
<text x="87" y="222" font-size="13" font-weight="700" fill="#6CA5C5" letter-spacing="2" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif">01</text>
<text x="87" y="264" font-size="34" font-weight="650" fill="#F5F2EB" letter-spacing="0" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif">性能</text>
<text x="87" y="291" font-size="11" font-weight="650" fill="#87A9BD" letter-spacing="1.8" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif">BENCHMARK</text>
<text x="478" y="222" font-size="13" font-weight="700" fill="#71C8B7" letter-spacing="2" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif">02</text>
<text x="478" y="264" font-size="34" font-weight="650" fill="#F5F2EB" letter-spacing="0" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif">有效产能</text>
<text x="478" y="291" font-size="11" font-weight="650" fill="#86BBAD" letter-spacing="1.8" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif">SLO-QUALIFIED</text>
<text x="885" y="222" font-size="13" font-weight="700" fill="#E2B17D" letter-spacing="2" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif">03</text>
<text x="885" y="264" font-size="34" font-weight="650" fill="#F5F2EB" letter-spacing="0" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif">单位成本</text>
<text x="885" y="291" font-size="11" font-weight="650" fill="#DBB58E" letter-spacing="1.8" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif">COST / TOKEN</text>
<!-- Throughput waveform: an unstable high peak is not necessarily usable capacity -->
<path d="M84 426 C115 408 128 373 150 382 S194 423 219 382 S253 331 280 363 S312 408 337 362 S374 331 413 365 L413 458 L84 458 Z" fill="url(#waveFill)"/>
<path d="M84 426 C115 408 128 373 150 382 S194 423 219 382 S253 331 280 363 S312 408 337 362 S374 331 413 365" fill="none" stroke="#6CB5E2" stroke-width="3.8" opacity="1" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
<path d="M84 450 H414" fill="none" stroke="#A0BED1" stroke-width="1" opacity="0.24" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="150" cy="382" r="3.2" fill="#99DBFF" opacity=".78"/><circle cx="219" cy="382" r="3.2" fill="#99DBFF" opacity=".78"/><circle cx="280" cy="363" r="3.2" fill="#99DBFF" opacity=".78"/><circle cx="337" cy="362" r="3.2" fill="#99DBFF" opacity=".78"/><circle cx="413" cy="365" r="3.2" fill="#99DBFF" opacity=".78"/>
<!-- SLO gate: transition from measured curve to deliverable flow -->
<line x1="444" y1="312" x2="444" y2="462" stroke="#6BAEAF" stroke-width="1.2" stroke-dasharray="4 9" opacity=".72"/>
<text x="428" y="323" font-size="12" font-weight="650" fill="#7DDAC2" letter-spacing="1.3" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif">SLO</text>
<circle cx="444" cy="383" r="8" fill="#0B1420" stroke="#90E5D4" stroke-width="2.6"/>
<path d="M452 383 C505 386 532 390 590 382 S700 383 753 382 S795 380 815 380" fill="none" stroke="url(#flowLine)" stroke-width="6.5" opacity="1" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
<path d="M472 359 C541 348 588 365 646 368 S736 366 810 380" fill="none" stroke="#83D7C3" stroke-width="1.8" opacity="0.34" stroke-linecap="round" stroke-linejoin="round" />
<path d="M472 407 C530 425 586 403 646 395 S748 392 810 380" fill="none" stroke="#83D7C3" stroke-width="1.8" opacity="0.3" stroke-linecap="round" stroke-linejoin="round" />
<path d="M500 340 C577 315 671 357 737 370 S789 377 813 380" fill="none" stroke="#83D7C3" stroke-width="1.2" opacity="0.16" stroke-linecap="round" stroke-linejoin="round" />
