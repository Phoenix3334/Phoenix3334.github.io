<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="954" viewBox="0 0 1200 954" role="img" aria-labelledby="title desc">
<title id="title">从性能压测到单位 Token 成本</title>
<desc id="desc">三层九步推理系统评估总览：业务负载、运行时、性能实测；SLO、集群产能、部署规划；五年TCO、Token经营、硬件选型。简化文字保留中国移动950DT关键数据，并标注真实测量与推算的区别。</desc>
<defs>
<style>
text{font-family:Inter,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei","Segoe UI",Arial,sans-serif}
.eyebrow{font-size:13px;fill:#197F79;font-weight:700;letter-spacing:1.8px}
.title{font-size:32px;fill:#253641;font-weight:740}
.subtitle{font-size:18px;fill:#687985}
.tierHead{font-size:17px;fill:#253641;font-weight:750}
.tierSub{font-size:15px;fill:#687985;font-weight:500}
.kicker{font-size:13px;fill:#687985;font-weight:700;letter-spacing:.5px}
.cardTitle{font-size:26px;fill:#253641;font-weight:730}
.body{font-size:18px;fill:#253641}
.key{font-size:18px;font-weight:730}
.footer{font-size:16px;fill:#586D77}
</style>
<marker id="arr" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#8198A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1200" height="954" fill="#FBFAF7"/>
<text x="40" y="38" class="eyebrow" >ONE-PAGE MAP · LLM INFERENCE ECONOMICS</text>
<text x="40" y="78" class="title" >从性能压测到单位 Token 成本</text>
<text x="40" y="111" class="subtitle" >Benchmark → SLO 有效产能 → 资源配置 → TCO → 硬件选型</text>
<rect x="40" y="142" width="1120" height="39" rx="6" fill="#F0EFEB" stroke="#E1DFD8" stroke-width="1.4"/>
 <text x="56" y="169" class="tierHead" >第一层 · MEASURE</text>
 <text x="336" y="169" class="tierSub" >/ 测量性能</text>
<rect x="40" y="196" width="350" height="160" rx="8" fill="#FFFFFF" stroke="#DADBD7" stroke-width="1.4"/>
  <rect x="40" y="196" width="350" height="5" rx="2.5" fill="#2457C5"/>
  <text x="61" y="224" class="kicker" >01 / WORKLOAD</text>
  <text x="61" y="263" class="cardTitle" >业务负载</text>
  <text x="61" y="301" class="body" >模型 · ISL/OSL · Cache</text>
  <text x="61" y="335" class="key" fill="#2457C5">统一测试条件</text>
  <path d="M397 279 L413 279" fill="none" stroke="#8198A0" stroke-width="2" marker-end="url(#arr)"/><rect x="425" y="196" width="350" height="160" rx="8" fill="#FFFFFF" stroke="#DADBD7" stroke-width="1.4"/>
  <rect x="425" y="196" width="350" height="5" rx="2.5" fill="#2457C5"/>
  <text x="446" y="224" class="kicker" >02 / RUNTIME</text>
  <text x="446" y="263" class="cardTitle" >运行时瓶颈</text>
  <text x="446" y="301" class="body" >Prefill/Decode · 通信</text>
  <text x="446" y="335" class="key" fill="#2457C5">关注关键路径</text>
  <path d="M782 279 L798 279" fill="none" stroke="#8198A0" stroke-width="2" marker-end="url(#arr)"/><rect x="810" y="196" width="350" height="160" rx="8" fill="#FFFFFF" stroke="#DADBD7" stroke-width="1.4"/>
  <rect x="810" y="196" width="350" height="5" rx="2.5" fill="#2457C5"/>
  <text x="831" y="224" class="kicker" >03 / BENCHMARK</text>
  <text x="831" y="263" class="cardTitle" >端到端实测</text>
  <text x="831" y="301" class="body" >417.80 Output TPS</text>
  <text x="831" y="335" class="key" fill="#2457C5">1,882.57 Total TPS</text>
  <path d="M986 361 L986 378" fill="none" stroke="#8198A0" stroke-width="2" marker-end="url(#arr)"/><rect x="40" y="388" width="1120" height="39" rx="6" fill="#EBF5F1" stroke="#CFE3DC" stroke-width="1.4"/>
 <text x="56" y="415" class="tierHead" >第二层 · QUALIFY &amp; SIZE</text>
 <text x="336" y="415" class="tierSub" >/ 确认有效产能</text>
<rect x="40" y="442" width="350" height="160" rx="8" fill="#FFFFFF" stroke="#DADBD7" stroke-width="1.4"/>
  <rect x="40" y="442" width="350" height="5" rx="2.5" fill="#197F79"/>
  <text x="61" y="470" class="kicker" >04 / SLO GATE</text>
  <text x="61" y="509" class="cardTitle" >服务质量</text>
  <text x="61" y="547" class="body" >TTFT · TPOT · 正确性</text>
  <text x="61" y="581" class="key" fill="#197F79">只计算达标吞吐</text>
  <path d="M397 525 L413 525" fill="none" stroke="#8198A0" stroke-width="2" marker-end="url(#arr)"/><rect x="425" y="442" width="350" height="160" rx="8" fill="#FFFFFF" stroke="#DADBD7" stroke-width="1.4"/>
  <rect x="425" y="442" width="350" height="5" rx="2.5" fill="#197F79"/>
  <text x="446" y="470" class="kicker" >05 / CAPACITY</text>
  <text x="446" y="509" class="cardTitle" >集群产能</text>
  <text x="446" y="547" class="body" >64 卡 ≈ 104 亿 Token/天</text>
  <text x="446" y="581" class="key" fill="#197F79">70% 利用率 ≈ 73 亿</text>
  <path d="M782 525 L798 525" fill="none" stroke="#8198A0" stroke-width="2" marker-end="url(#arr)"/><rect x="810" y="442" width="350" height="160" rx="8" fill="#FFFFFF" stroke="#DADBD7" stroke-width="1.4"/>
  <rect x="810" y="442" width="350" height="5" rx="2.5" fill="#197F79"/>
  <text x="831" y="470" class="kicker" >06 / SIZING</text>
  <text x="831" y="509" class="cardTitle" >部署规模</text>
  <text x="831" y="547" class="body" >P/D · KV 传输 · 冗余</text>
  <text x="831" y="581" class="key" fill="#197F79">按业务 QPS 配实例</text>
  <path d="M986 607 L986 624" fill="none" stroke="#8198A0" stroke-width="2" marker-end="url(#arr)"/><rect x="40" y="634" width="1120" height="39" rx="6" fill="#FAF0EA" stroke="#EDD3C7" stroke-width="1.4"/>
 <text x="56" y="661" class="tierHead" >第三层 · COST &amp; DECIDE</text>
 <text x="336" y="661" class="tierSub" >/ 核算成本与选型</text>
<rect x="40" y="688" width="350" height="160" rx="8" fill="#FFFFFF" stroke="#DADBD7" stroke-width="1.4"/>
  <rect x="40" y="688" width="350" height="5" rx="2.5" fill="#B65334"/>
  <text x="61" y="716" class="kicker" >07 / TCO</text>
  <text x="61" y="755" class="cardTitle" >五年投入</text>
  <text x="61" y="793" class="body" >381.66 万元/台</text>
  <text x="61" y="827" class="key" fill="#B65334">月摊销 ≈ 6.36 万</text>
  <path d="M397 771 L413 771" fill="none" stroke="#8198A0" stroke-width="2" marker-end="url(#arr)"/><rect x="425" y="688" width="350" height="160" rx="8" fill="#FFFFFF" stroke="#DADBD7" stroke-width="1.4"/>
  <rect x="425" y="688" width="350" height="5" rx="2.5" fill="#B65334"/>
  <text x="446" y="716" class="kicker" >08 / TOKEN ECONOMICS</text>
  <text x="446" y="755" class="cardTitle" >Token 经营</text>
  <text x="446" y="793" class="body" >GLM ≈ 10.07 万元/月</text>
  <text x="446" y="827" class="key" fill="#B65334">DS ≈ 5.61 万元/月</text>
  <path d="M782 771 L798 771" fill="none" stroke="#8198A0" stroke-width="2" marker-end="url(#arr)"/><rect x="810" y="688" width="350" height="160" rx="8" fill="#FFFFFF" stroke="#DADBD7" stroke-width="1.4"/>
  <rect x="810" y="688" width="350" height="5" rx="2.5" fill="#B65334"/>
  <text x="831" y="716" class="kicker" >09 / SELECTION</text>
  <text x="831" y="755" class="cardTitle" >硬件选型</text>
  <text x="831" y="793" class="body" >同负载 · 同 SLO</text>
  <text x="831" y="827" class="key" fill="#B65334">比较 Cost / Token</text>
  
<rect x="40" y="880" width="1120" height="54" rx="8" fill="#FFFFFF" stroke="#DADBD7" stroke-width="1.4"/>
<text x="60" y="912" class="footer" >数据源：950DT 测算报告。产能与收入为假设下的推算；不同负载、SLO 和计费周期不可混用。</text>
</svg>