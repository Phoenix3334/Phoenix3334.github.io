<circle cx="814" cy="380" r="6" fill="#F0C98B" filter="url(#glow)"/>
<!-- Final economics symbol: cost numerator over delivered-token denominator -->
<circle cx="1010" cy="381" r="92" fill="#131D29" stroke="#D6AB76" stroke-width="1.5" stroke-opacity=".63"/>
<circle cx="1010" cy="381" r="74" fill="none" stroke="#D6AB76" stroke-width=".9" stroke-opacity=".3" stroke-dasharray="3 7"/>
<text x="973" y="369" font-size="48" font-weight="500" fill="#F3CE9C" letter-spacing="0" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif">¥</text>
<line x1="958" y1="393" x2="1062" y2="393" stroke="#F3CE9C" stroke-width="2" opacity=".78"/>
<text x="975" y="418" font-size="28" font-weight="600" fill="#F3CE9C" letter-spacing="0" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif">tok</text>
<path d="M820 380 H909" fill="none" stroke="#DDB981" stroke-width="2.3" opacity="0.78" stroke-linecap="round" stroke-linejoin="round" />
<path d="M899 374 L911 380 L899 386" fill="none" stroke="#E4C18D" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="70" y1="490" x2="1130" y2="490" stroke="#A2BAC5" stroke-opacity=".23"/>
<text x="74" y="516" font-size="11" font-weight="600" fill="#758D9D" letter-spacing="2" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif">MEASURE</text>
<text x="483" y="516" font-size="11" font-weight="600" fill="#758D9D" letter-spacing="2" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif">QUALIFY</text>
<text x="888" y="516" font-size="11" font-weight="600" fill="#758D9D" letter-spacing="2" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif">DECIDE</text>
</svg>