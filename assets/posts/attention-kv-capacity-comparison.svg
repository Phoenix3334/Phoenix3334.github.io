<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="575" viewBox="0 0 1200 575" role="img" aria-labelledby="title desc"><title id="title">MHA GQA MQA MLA KV Cache capacity</title><desc id="desc">Hypothetical 32 layers, 4096 tokens, bf16, 32 query heads, head dim 128. MHA 2048 MiB, GQA8 512 MiB, MQA 64 MiB, MLA 144 MiB based on 512 latent and 64 RoPE dimensions. Storage-only comparison.</desc><defs><style>text{font-family:Inter,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}.kicker{font-size:13px;letter-spacing:1.4px;font-weight:740;fill:#178173}.title{font-size:28px;font-weight:740;fill:#263A45}.sub{font-size:16px;fill:#667983}.name{font-size:23px;font-weight:730;fill:#263A45}.note{font-size:16px;fill:#667983}.value{font-size:22px;font-weight:760}.small{font-size:14px;fill:#667983}.tag{font-size:18px;font-weight:720;fill:#263A45}</style><marker id="arr" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8.7 5 L1 9" fill="none" stroke="#82949C" stroke-width="1.5" stroke-linecap="round"/></marker></defs><rect width="1200" height="575" fill="#FBFAF7"/><text x="42" y="38" class="kicker" >KV CACHE / SAME WORKLOAD</text><text x="42" y="82" class="title" >四种存储方式：到底省了多少历史 KV？</text><text x="42" y="110" class="sub" >统一口径：32 层 · Hq=32 · head_dim=128 · L=4096 · BF16 · 单请求</text><text x="42" y="180" class="name" >MHA</text><text x="149" y="180" class="note" >32 个 KV Head</text><rect x="423" y="150" width="622" height="46" rx="6" fill="#F0F1EF" stroke="#F0F1EF" stroke-width="1.4"/><rect x="423" y="150" width="622" height="46" rx="6" fill="#2457C5"/><text x="1070" y="179" class="value" fill="#2457C5">2,048 MiB</text><text x="42" y="260" class="name" >GQA</text><text x="149" y="260" class="note" >8 个 KV Head</text><rect x="423" y="230" width="622" height="46" rx="6" fill="#F0F1EF" stroke="#F0F1EF" stroke-width="1.4"/><rect x="423" y="230" width="155.5" height="46" rx="6" fill="#178173"/><text x="1070" y="259" class="value" fill="#178173">512 MiB</text><text x="42" y="340" class="name" >MQA</text><text x="149" y="340" class="note" >1 个 KV Head</text><rect x="423" y="310" width="622" height="46" rx="6" fill="#F0F1EF" stroke="#F0F1EF" stroke-width="1.4"/><rect x="423" y="310" width="19.4375" height="46" rx="6" fill="#B65A3C"/><text x="1070" y="339" class="value" fill="#B65A3C">64 MiB</text><text x="42" y="420" class="name" >MLA</text><text x="149" y="420" class="note" >512 Latent + 64 RoPE</text><rect x="423" y="390" width="622" height="46" rx="6" fill="#F0F1EF" stroke="#F0F1EF" stroke-width="1.4"/><rect x="423" y="390" width="43.734375" height="46" rx="6" fill="#6975B6"/><text x="1070" y="419" class="value" fill="#6975B6">144 MiB</text><rect x="42" y="497" width="1116" height="59" rx="9" fill="#FFFFFF" stroke="#D9DEDB" stroke-width="1.4"/><text x="61" y="521" class="tag" >GQA 通过共享 KV Head 压缩；MLA 改为存压缩后的 Latent 与 RoPE Key。</text><text x="61" y="545" class="small" >这里仅比较 KV 存储，不包含模型权重、临时 Tensor、分页元数据或实际 Kernel 速度。</text></svg>