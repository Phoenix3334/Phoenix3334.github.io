<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="577" viewBox="0 0 1200 577" role="img" aria-labelledby="title desc"><title id="title">MLA weight absorption illustration</title><desc id="desc">Unoptimized MLA decode expands all historical latent into full keys and values, while absorbed decode transforms queries into latent space and absorbs value projection into output. Decoupled RoPE remains cached separately.</desc><defs><style>text{font-family:Inter,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}.kicker{font-size:13px;letter-spacing:1.4px;font-weight:740;fill:#178173}.title{font-size:28px;font-weight:740;fill:#263A45}.sub{font-size:16px;fill:#667983}.name{font-size:23px;font-weight:730;fill:#263A45}.note{font-size:16px;fill:#667983}.value{font-size:22px;font-weight:760}.small{font-size:14px;fill:#667983}.tag{font-size:18px;font-weight:720;fill:#263A45}</style><marker id="arr" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8.7 5 L1 9" fill="none" stroke="#82949C" stroke-width="1.5" stroke-linecap="round"/></marker></defs><rect width="1200" height="577" fill="#FBFAF7"/><text x="40" y="38" class="kicker" >MLA / WEIGHT ABSORPTION</text><text x="40" y="81" class="title" >为什么 MLA 不能每步把历史 K/V 全部解压？</text><text x="40" y="110" class="sub" >上方：朴素 Decode 每步展开历史；下方：将上投影挪到 Query / Output 一侧。</text>
<rect x="40" y="140" width="1119" height="170" rx="11" fill="#FFF" stroke="#D9DEDB" stroke-width="1.4"/><text x="60" y="174" class="name" >朴素路径</text>
<rect x="62" y="200" width="173" height="66" rx="10" fill="#EFF3FB" stroke="#DAE5F8" stroke-width="1.4"/><text x="148.5" y="239" class="tag" text-anchor="middle">历史 c_KV</text>
<path d="M238 232 H286" fill="none" stroke="#82949C" stroke-width="2.1" stroke-linecap="round"  marker-end="url(#arr)"/>
<rect x="298" y="200" width="236" height="66" rx="10" fill="#FAF0EA" stroke="#EED6CA" stroke-width="1.4"/><text x="416" y="239" class="tag" text-anchor="middle">逐历史升维 K/V</text>
<path d="M535 232 H590" fill="none" stroke="#82949C" stroke-width="2.1" stroke-linecap="round"  marker-end="url(#arr)"/>
<rect x="605" y="200" width="224" height="66" rx="10" fill="#FAF0EA" stroke="#EED6CA" stroke-width="1.4"/><text x="717" y="239" class="tag" text-anchor="middle">大中间 Tensor</text>
<path d="M832 232 H887" fill="none" stroke="#82949C" stroke-width="2.1" stroke-linecap="round"  marker-end="url(#arr)"/>
<rect x="903" y="200" width="223" height="66" rx="10" fill="#EFF3FB" stroke="#DAE5F8" stroke-width="1.4"/><text x="1014.5" y="239" class="tag" text-anchor="middle">Attention</text>
<rect x="40" y="338" width="1119" height="184" rx="11" fill="#FFF" stroke="#D9DEDB" stroke-width="1.4"/><text x="60" y="372" class="name" >吸收路径 / Decode</text>
<rect x="62" y="392" width="175" height="73" rx="10" fill="#EFF3FB" stroke="#D7E3FA" stroke-width="1.4"/><text x="149.5" y="434.5" class="tag" text-anchor="middle">当前 Q</text>
<path d="M239 428 H291" fill="none" stroke="#82949C" stroke-width="2.1" stroke-linecap="round"  marker-end="url(#arr)"/>
<rect x="306" y="392" width="240" height="73" rx="10" fill="#E9F4F0" stroke="#C9E2D9" stroke-width="1.4"/><text x="426" y="434.5" class="tag" text-anchor="middle">Q × W_UKᵀ</text>
<path d="M549 428 H598" fill="none" stroke="#82949C" stroke-width="2.1" stroke-linecap="round"  marker-end="url(#arr)"/>
<rect x="615" y="392" width="239" height="73" rx="10" fill="#E9F4F0" stroke="#C9E2D9" stroke-width="1.4"/><text x="734.5" y="434.5" class="tag" text-anchor="middle">与缓存 c_KV 相乘</text>
<path d="M859 428 H902" fill="none" stroke="#82949C" stroke-width="2.1" stroke-linecap="round"  marker-end="url(#arr)"/>
<rect x="917" y="392" width="209" height="73" rx="10" fill="#E9F4F0" stroke="#C9E2D9" stroke-width="1.4"/><text x="1021.5" y="434.5" class="tag" text-anchor="middle">输出侧吸收</text>
<text x="615" y="492" class="note" >缓存：c_KV（512）+ RoPE Key（64）</text>
<text x="40" y="554" class="note" >要点：Content 不必恢复出完整 K/V；RoPE 走单独的位置通路。具体 Prefill / Decode Kernel 可采用不同实现。</text></svg>