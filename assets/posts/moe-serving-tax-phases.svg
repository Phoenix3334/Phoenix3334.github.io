<path d="M807 617 H857" stroke="#71869B" stroke-width="2.5" fill="none"/><path d="M849 609 L859 617 L849 625" stroke="#71869B" stroke-width="2.5" fill="none"/>
<rect x="862" y="580" width="252" height="74" rx="9" fill="#E9F5EF" stroke="#B7D8C2"/>
<text x="988" y="609" fill="#176D62" font-size="17" font-weight="740" text-anchor="middle">Padded Work · Pg</text><text x="988" y="634" fill="#526879" font-size="15" text-anchor="middle">ηg × Rg / actual tile work</text>
<text x="82" y="681" fill="#526879" font-size="15">EPLB 若只平衡原始 Rg，可能仍留下 Pg 的差异；Padding 方案不同，最坏分布也不同。</text>
</g></svg>