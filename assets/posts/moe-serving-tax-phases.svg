<text x="444" y="609" fill="#253943" font-size="17" font-weight="700" text-anchor="middle">Bins</text><text x="444" y="634" fill="#687A84" font-size="15" text-anchor="middle">Logical Experts · Ni</text>
<path d="M547 617 H597" stroke="#71869B" stroke-width="2.5" fill="none"/><path d="M589 609 L599 617 L589 625" stroke="#71869B" stroke-width="2.5" fill="none"/>
