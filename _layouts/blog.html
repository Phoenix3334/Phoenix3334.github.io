<!doctype html>
<html lang="{{ page.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% capture page_title %}{% if page.title %}{{ page.title }} | {% endif %}Feihong Guo{% endcapture %}
  <title>{{ page_title | strip | escape }}</title>
  <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta name="theme-color" content="#fbfaf7">
  <link rel="stylesheet" href="{{ '/blog/assets/blog.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap topbar">
      <a class="wordmark" href="{{ '/' | relative_url }}">Feihong Guo</a>
      <nav aria-label="Site navigation">
        <a href="{{ '/' | relative_url }}">Portfolio / 主页</a>
        <a class="current" href="{{ '/blog/' | relative_url }}">Blog / 技术笔记</a>
        <a href="https://github.com/Phoenix3334" rel="noopener noreferrer">GitHub</a>
      </nav>
    </div>
  </header>
  <main class="wrap content">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span>© {{ site.time | date: '%Y' }} Feihong Guo</span>
      <span>Notes on AI systems &amp; engineering</span>
    </div>
  </footer>
</body>
</html>
